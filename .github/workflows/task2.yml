name: Task 2 - Python Unit Testing with Coverage

on:
  push:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    # 1. Копіюємо код проєкту на віртуальну машину GitHub
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. Встановлюємо Python на віртуальну машину
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Встановлюємо pytest та pytest-cov з нашого requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Запускаємо тести з перевіркою покриття (fail, якщо < 70%)
    - name: Run tests with pytest and coverage
      env:
        PYTHONPATH: .
      run: |
        pytest --cov=myapp tests/ --cov-fail-under=70 --cov-report=term-missing --cov-report=xml

    # 5. Завантажуємо звіт про покриття як артефакт (пункт 3.3 із завдання)
    - name: Upload coverage report artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
