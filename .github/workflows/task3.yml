name: Task 3 - Add Build Step and Badge

# Робот реагує ТІЛЬКИ на пул-реквести в develop
on:
  pull_request:
    branches: [ "develop" ]

# Нам знадобляться права на запис, щоб робот міг відредагувати README.md і зробити коміт
permissions:
  contents: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with pytest and coverage
      env:
        PYTHONPATH: .
      run: |
        pytest --cov=myapp tests/ --cov-fail-under=70 --cov-report=term-missing --cov-report=xml

    - name: Upload coverage report artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

  # ОНОВЛЕННЯ: Додаємо роботу build, яка чекає на роботу run-tests
  build:
    runs-on: ubuntu-latest
    needs: run-tests # Оця магія каже: "Не запускайся, поки тести не пройдуть успішно!"
    
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Add build status badge to README if not exists
      env:
        # Автоматичний секретний токен для авторизації в Git
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
      run: |
        # Посилання на офіційний бейдж твого воркфлоу
        BADGE="![Build Status](https://github.com/${{ github.repository }}/actions/workflows/workflow.yml/badge.svg)"
        
        # Перевіряємо, чи є вже слово "Build Status" у файлі README.md
        if grep -q "Build Status" README.md; then
          echo "Badge already exists in README.md, skipping."
        else
          echo "Badge not found. Adding badge to the top of README.md..."
          # Записуємо бейдж на самий початок файлу
          echo -e "$BADGE\n\n$(cat README.md)" > README.md
          
          # Налаштовуємо робота, щоб він представився в Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Комітимо і пушимо зміни прямо в гілку пул-реквесту
          git add README.md
          git commit -m "docs: add build status badge to README [skip ci]"
          git push
        fi
